apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: app-runtime
  labels:
    app: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: nats
          image: docker.io/nats:2.10
          # Disable JetStream for the demo profile to avoid persistent storage requirements.
          args: []
          ports:
            - containerPort: 4222
          livenessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: app-runtime
spec:
  selector:
    app: nats
  ports:
    - port: 4222
      targetPort: 4222
