apiVersion: batch/v1
kind: Job
metadata:
  name: app-runtime-smoke
  namespace: app-runtime
  labels:
    app: smoke-test
spec:
  template:
    metadata:
      labels:
        app: smoke-test
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: curl
          image: docker.io/curlimages/curl:8.6.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "[smoke] DNS check (short name):"
              curl --fail --show-error -sv http://traefik:80/ 2>&1 || true
              echo "[smoke] DNS check (FQDN):"
              curl --fail --show-error -sv http://traefik.app-runtime.svc.cluster.local:80/ 2>&1 || true
              for i in $(seq 1 30); do
                echo "[smoke] attempt ${i}/30"
                if curl --fail --show-error -sv http://traefik:80/ 2>&1; then
                  echo "[smoke] success on attempt ${i}"
                  exit 0
                fi
                sleep 2
              done
              echo "[smoke] exhausted retries"
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
