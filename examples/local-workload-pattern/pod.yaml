apiVersion: v1
kind: Pod
metadata:
  name: local-workload
spec:
  containers:
    - name: worker
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo local workload && sleep 3600"]
      resources:
        limits:
          cpu: "50m"
          memory: "64Mi"
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      emptyDir: {}
