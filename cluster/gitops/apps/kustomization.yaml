# Policies only: Flux Kustomization rathsted-sync (prune: true) reconciles
# this tree, so a deleted or weakened policy self-heals within the reconcile
# interval. Bootstrap still applies policies/ once as the pre-Flux seed; Flux
# owns them thereafter. The path keeps its 2.0.x name so the rathsted-sync
# object on existing clusters, and a components: entry added here, keep
# working. Workloads (the demo app and your own) belong in
# cluster/gitops/workloads (rathsted-apps): an object Flux cannot apply here
# would stop the policies being applied.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../policies
  - hello-gitops-registry-exception.yaml
