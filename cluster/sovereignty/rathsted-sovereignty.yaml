# Cluster sovereignty facts — DISPLAY / INSPECTION output only.
#
# This ConfigMap is NOT read by Kyverno at admission. It is a rendered view of
# the single canonical sovereignty stanza, published so operators and the
# evidence layer can read the cluster's declared sovereignty. The admission
# stamp (policies/require-namespace-labels.yaml) carries the SAME operator-control
# value as a rendered literal; the ops-ledger config carries the same stanza.
# The consistency check (.tools/check-sovereignty-consistency.py) fails CI if
# these three drift. Changing sovereignty = a GitOps commit here, not a runtime edit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rathsted-sovereignty
  namespace: kube-system
  labels:
    owner: platform
    environment: platform
    rathsted.io/jurisdiction: ca
  annotations:
    rathsted.io/operator-control-source: overlay-rendered-literal
data:
  runtime_jurisdiction: ca
  operator_control: foreign-provider
  provider: ovhcloud
  provider_region: ca-bhs
  provider_legal_jurisdiction: fr
