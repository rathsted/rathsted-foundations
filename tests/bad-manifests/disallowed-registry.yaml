apiVersion: v1
kind: Pod
metadata:
  name: bad-registry
spec:
  containers:
    - name: bad
      image: docker.io/library/nginx:latest
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "20m"
          memory: "64Mi"
      livenessProbe:
        httpGet:
          path: /
          port: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
