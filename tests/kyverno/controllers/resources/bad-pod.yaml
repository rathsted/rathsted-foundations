# Bare Pod fixture: same pod spec as the bad-* controller fixtures.
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod
  namespace: default
  labels:
    app.kubernetes.io/name: bad-pod
spec:
  hostNetwork: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: app
      image: ghcr.io/rathsted/nginx:1.29.7-alpine
      securityContext:
        privileged: true
        readOnlyRootFilesystem: false
        capabilities:
          add:
            - SYS_ADMIN
      volumeMounts:
        - name: host
          mountPath: /host
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
      livenessProbe:
        httpGet:
          path: /
          port: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
  volumes:
    - name: host
      hostPath:
        path: /
