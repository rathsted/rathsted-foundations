# Pod controller fixture: the pod spec lives under the controller's template,
# not request.object.spec. See CHANGELOG (foreach autogen fix).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: badinit-cronjob
  namespace: default
  labels:
    app.kubernetes.io/name: badinit-cronjob
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: badinit-cronjob
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          initContainers:
            - name: init
              image: ghcr.io/rathsted/nginx:1.29.7-alpine
              securityContext:
                privileged: true
                readOnlyRootFilesystem: false
                capabilities:
                  add:
                    - SYS_ADMIN
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "100m"
                  memory: "128Mi"
          containers:
            - name: app
              image: ghcr.io/rathsted/nginx:1.29.7-alpine
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "100m"
                  memory: "128Mi"
              livenessProbe:
                httpGet:
                  path: /
                  port: 80
              readinessProbe:
                httpGet:
                  path: /
                  port: 80
