# Bare Pod fixture: same pod spec as the badinit-* controller fixtures.
apiVersion: v1
kind: Pod
metadata:
  name: badinit-pod
  namespace: default
  labels:
    app.kubernetes.io/name: badinit-pod
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  initContainers:
    - name: init
      image: ghcr.io/rathsted/nginx:1.29.7-alpine
      securityContext:
        privileged: true
        readOnlyRootFilesystem: false
        capabilities:
          add:
            - SYS_ADMIN
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
  containers:
    - name: app
      image: ghcr.io/rathsted/nginx:1.29.7-alpine
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
      livenessProbe:
        httpGet:
          path: /
          port: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
