# Pod controller fixture: the pod spec lives under the controller's template,
# not request.object.spec. See CHANGELOG (foreach autogen fix).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bad-statefulset
  namespace: default
  labels:
    app.kubernetes.io/name: bad-statefulset
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bad-statefulset
  serviceName: bad-statefulset
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bad-statefulset
    spec:
      hostNetwork: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          image: ghcr.io/rathsted/nginx:1.29.7-alpine
          securityContext:
            privileged: true
            readOnlyRootFilesystem: false
            capabilities:
              add:
                - SYS_ADMIN
          volumeMounts:
            - name: host
              mountPath: /host
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
      volumes:
        - name: host
          hostPath:
            path: /
      initContainers:
        - name: init
          image: ghcr.io/rathsted/nginx:1.29.7-alpine
          securityContext:
            privileged: true
            readOnlyRootFilesystem: false
            capabilities:
              add:
                - SYS_ADMIN
