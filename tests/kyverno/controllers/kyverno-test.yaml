apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rathsted-pod-controller-policies
# Pod controllers (Deployment, StatefulSet, DaemonSet, Job, CronJob,
# ReplicationController) carry the pod spec under spec.template.spec (CronJob: spec.jobTemplate.spec.template.spec).
# Each container-level policy matches Pod only and relies on Kyverno autogen to
# rewrite request.object.spec for controllers, so a non-compliant controller is
# denied at admission instead of being admitted and failing later at Pod
# creation. Autogen rule names: autogen-<rule> for Deployment, StatefulSet,
# DaemonSet, Job and ReplicationController; autogen-cronjob-<rule> for CronJob.
#
# Pods keep the base rule names.
#
# kyverno test (CLI v1.19.1) reports a result whose rule produced no response
# as Pass/Excluded, so on its own this file cannot catch a rule that silently
# never runs on a controller. scripts/test-policy-controllers.sh is the
# non-vacuous guard: it counts real pass/fail responses per policy.
#
# Each bad-* fixture violates every rule below (bad controllers also carry a
# violating initContainer). Each badinit-* fixture has a compliant main
# container and a violating initContainer: it fails the container-level rules
# only if the policies check initContainers.; each good-* fixture passes all.
policies:
  - ../../../policies/disallow-privileged.yaml
  - ../../../policies/drop-all-capabilities.yaml
  - ../../../policies/require-seccomp.yaml
  - ../../../policies/require-readonly-rootfs.yaml
  - ../../../policies/disallow-host-namespaces.yaml
  - ../../../policies/restrict-hostpath.yaml
resources:
  - resources/bad-pod.yaml
  - resources/bad-deployment.yaml
  - resources/bad-statefulset.yaml
  - resources/bad-daemonset.yaml
  - resources/bad-job.yaml
  - resources/bad-cronjob.yaml
  - resources/bad-replicationcontroller.yaml
  - resources/badinit-pod.yaml
  - resources/badinit-deployment.yaml
  - resources/badinit-statefulset.yaml
  - resources/badinit-daemonset.yaml
  - resources/badinit-job.yaml
  - resources/badinit-cronjob.yaml
  - resources/badinit-replicationcontroller.yaml
  - resources/good-pod.yaml
  - resources/good-deployment.yaml
  - resources/good-statefulset.yaml
  - resources/good-daemonset.yaml
  - resources/good-job.yaml
  - resources/good-cronjob.yaml
  - resources/good-replicationcontroller.yaml
