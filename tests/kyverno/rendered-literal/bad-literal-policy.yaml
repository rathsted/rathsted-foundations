# Test fixture ONLY — a deliberately mis-rendered variant of
# policies/require-namespace-labels.yaml where the overlay rendered an invalid
# operator-control literal ("foreign" instead of "foreign-provider"). Proves R3
# test #5: a bad rendered literal is rejected by the validate rule, so a broken
# render fails closed instead of stamping an out-of-vocabulary control value.
# NOT installed on any cluster.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-namespace-labels-bad-literal
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: stamp-operator-control
      match:
        any:
          - resources:
              kinds:
                - Namespace
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              rathsted.io/operator-control: foreign   # BAD literal (not in enum)
    - name: validate-namespace-labels
      match:
        any:
          - resources:
              kinds:
                - Namespace
      validate:
        message: >-
          Namespaces must set owner, environment, rathsted.io/jurisdiction
          (one of: ca, us, fr), and rathsted.io/operator-control
          (one of: customer, domestic-provider, foreign-provider, rathsted).
        deny:
          conditions:
            any:
              - key: "{{ request.object.metadata.labels.owner || '' }}"
                operator: Equals
                value: ""
              - key: "{{ request.object.metadata.labels.environment || '' }}"
                operator: Equals
                value: ""
              - key: "{{ request.object.metadata.labels.\"rathsted.io/jurisdiction\" || '' }}"
                operator: AnyNotIn
                value:
                  - ca
                  - us
                  - fr
              - key: "{{ request.object.metadata.labels.\"rathsted.io/operator-control\" || '' }}"
                operator: AnyNotIn
                value:
                  - customer
                  - domestic-provider
                  - foreign-provider
                  - rathsted
