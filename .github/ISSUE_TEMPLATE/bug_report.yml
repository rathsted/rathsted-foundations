name: Bug Report
description: Report a problem with Rathsted Foundations
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands or steps to trigger the issue.
      placeholder: |
        1. Run `make install`
        2. Run `make verify`
        3. See error...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version or commit are you using?
      placeholder: "v0.2.4"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      description: Ubuntu version or other OS
      placeholder: "Ubuntu 24.04"
    validations:
      required: true
