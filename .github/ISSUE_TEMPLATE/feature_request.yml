name: Feature Request
description: Suggest a new capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this solve? What are you trying to do?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Bootstrap / Install
        - Policies (Kyverno)
        - GitOps (Flux)
        - Supply chain (signing, SBOM)
        - Documentation
        - Other
    validations:
      required: true
