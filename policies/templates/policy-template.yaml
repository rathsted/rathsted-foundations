apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: replace-with-policy-name
spec:
  validationFailureAction: Enforce
  rules:
    - name: replace-with-rule-name
      match:
        resources:
          kinds:
            - Pod
      exclude:
        resources:
          namespaces:
            - kube-system
            - flux-system
            - kyverno
      validate:
        message: "replace with a plain-language failure message"
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
