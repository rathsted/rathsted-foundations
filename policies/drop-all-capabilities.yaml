apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: drop-all-capabilities
  annotations:
    # Rules match Pod only so Kyverno autogen (v1.19.1) generates the
    # controller rules: autogen-<rule> for DaemonSet, Deployment, Job,
    # StatefulSet and ReplicationController, autogen-cronjob-<rule> for CronJob,
    # with request.object.spec rewritten to the pod template. ReplicaSet is in
    # Kyverno's resourceFilters. Listing the controllers in the rule itself
    # disables autogen and the rule then reads the controller's own spec, which
    # holds no pod fields. PolicyExceptions for controllers must name the
    # autogen rules.
    pod-policies.kyverno.io/autogen-controllers: DaemonSet,Deployment,Job,StatefulSet,ReplicationController,CronJob
spec:
  validationFailureAction: Enforce
  rules:
    - name: require-drop-all
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        resources:
          namespaces:
            - kube-system
            - flux-system
            - kyverno
      validate:
        message: "Containers must drop ALL capabilities. Only NET_BIND_SERVICE may be added."
        foreach:
          - list: "request.object.spec.[containers, initContainers, ephemeralContainers][]"
            deny:
              conditions:
                any:
                  - key: "{{ length(element.securityContext.capabilities.drop || `[]`) }}"
                    operator: Equals
                    value: 0
                  - key: "ALL"
                    operator: AnyNotIn
                    value: "{{ element.securityContext.capabilities.drop || `[]` }}"
    - name: restrict-added-capabilities
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        resources:
          namespaces:
            - kube-system
            - flux-system
            - kyverno
      validate:
        message: "Only NET_BIND_SERVICE may be added as a capability."
        foreach:
          - list: "request.object.spec.[containers, initContainers, ephemeralContainers][]"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.capabilities.add || [] }}"
                    operator: AnyNotIn
                    value:
                      - NET_BIND_SERVICE
