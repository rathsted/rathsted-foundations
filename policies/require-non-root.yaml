apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
spec:
  validationFailureAction: Enforce
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        resources:
          namespaces:
            - kube-system
            - flux-system
            - kyverno
      validate:
        message: "Containers must run as non-root. Pod-level runAsNonRoot must be true and no container may set runAsNonRoot: false or runAsUser: 0."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
            containers:
              - securityContext:
                  allowPrivilegeEscalation: "false"
                  capabilities:
                    drop:
                      - "ALL"
                  =(runAsNonRoot): "!false"
                  =(runAsUser): "!0"
            =(initContainers):
              - securityContext:
                  allowPrivilegeEscalation: "false"
                  capabilities:
                    drop:
                      - "ALL"
                  =(runAsNonRoot): "!false"
                  =(runAsUser): "!0"
            =(ephemeralContainers):
              - securityContext:
                  allowPrivilegeEscalation: "false"
                  capabilities:
                    drop:
                      - "ALL"
                  =(runAsNonRoot): "!false"
                  =(runAsUser): "!0"
