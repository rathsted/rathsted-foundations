apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-registries
spec:
  validationFailureAction: Enforce
  rules:
    - name: allowed-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        resources:
          namespaces:
            - kube-system
            - flux-system
            - kyverno
      validate:
        # First-party images (ghcr.io/rathsted/*) must be signed — see
        # require-signed-images. localhost/* is a dev/kind surface for
        # locally-loaded images and is NOT signature-checked.
        message: "Images must come from allowed registries (ghcr.io/rathsted or localhost)"
        anyPattern:
          - spec:
              containers:
                - image: "ghcr.io/rathsted/*"
              =(initContainers):
                - image: "ghcr.io/rathsted/*"
              =(ephemeralContainers):
                - image: "ghcr.io/rathsted/*"
          - spec:
              containers:
                - image: "localhost/*"
              =(initContainers):
                - image: "localhost/*"
              =(ephemeralContainers):
                - image: "localhost/*"
