# Stamps rathsted.io/operator-control: rathsted on every governed namespace.
# Enable exactly one operator-control component, in cluster/gitops/apps/kustomization.yaml:
#   components:
#     - ../../../components/operator-control/rathsted
# See docs/operator-control-components.md. The patch is the one
# bootstrap/lib/jurisdiction.sh renders for RATHSTED_OPERATOR_CONTROL=rathsted.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: kyverno.io
      kind: ClusterPolicy
      name: require-namespace-labels
    patch: |-
      - op: test
        path: /spec/rules/0/name
        value: stamp-operator-control
      - op: replace
        path: /spec/rules/0/mutate/patchStrategicMerge/metadata/labels/rathsted.io~1operator-control
        value: rathsted
